[package]
name = "openkakao-jarvis-desktop"
version = "0.1.0"
description = "OpenKakao Tauri menubar shell with a local Jarvis core"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
thiserror = "2"
