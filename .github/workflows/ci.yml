name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: Cargo.toml

jobs:
  python-harness:
    name: Launchd and Python harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind checkout to the triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Launchd artifact harness
        run: sh scripts/test-auto-reply-launchd-artifacts.sh

  macos:
    name: macOS cargo test
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind checkout to the triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache cargo registry and build
        uses: actions/cache@1bd1e32a3bdc45362d1e72693637ccab84c8af25  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-${{ runner.os }}-

      - name: Cargo test
        run: cargo test --manifest-path $MANIFEST

      - name: Smoke CLI
        run: cargo build --manifest-path $MANIFEST && ./target/debug/openkakao-cli --version
