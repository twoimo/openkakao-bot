name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: Cargo.toml

jobs:
  python-harness:
    name: Launchd and Python harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind checkout to the triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Launchd artifact harness
        run: sh scripts/test-auto-reply-launchd-artifacts.sh

  macos:
    name: macOS cargo test
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind checkout to the triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-${{ runner.os }}-

      - name: Cargo test
        run: cargo test --manifest-path $MANIFEST

      - name: Smoke CLI
        run: cargo build --manifest-path $MANIFEST && ./target/debug/openkakao-cli --version

      # The menu extra is a separate program from the CLI and used to have no
      # check at all: a broken card layout shipped because nothing compiled it
      # (2026-09-16).
      - name: Build menu extra
        run: sh scripts/build-auto-reply-menubar.sh

      - name: Menu extra tests
        run: python3 -m unittest tests.test_auto_reply_menubar

      # The windows cannot be seen from CI, so the app dumps every view frame
      # and a PNG of each window off-screen, and the audit reads them back.
      - name: Audit menu layout
        run: |
          APP=macos/AutoReplyMenu/build/AutoReplyMenu.app/Contents/MacOS/AutoReplyMenu
          "$APP" --layout-audit /tmp/layout-audit \
            --python "$(command -v python3)" \
            --script "$PWD/scripts/auto-reply-menubar.py" \
            --state-root /tmp/layout-audit-state \
            --bin "$PWD/target/debug/openkakao-cli"
          python3 scripts/audit-menubar-layout.py /tmp/layout-audit > /tmp/layout-audit/report.txt
          python3 scripts/check-menubar-layout.py /tmp/layout-audit
