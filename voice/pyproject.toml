[project]
name = "openkakao-jarvis-voice"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mlx-whisper>=0.4",
  "numpy>=2.0,<3",
  "openwakeword>=0.6,<1",
  "qwen-tts>=0.1",
  "sounddevice>=0.5,<1",
  "webrtcvad-wheels>=2.0.14,<3",
]

[tool.uv]
package = false

[project.optional-dependencies]
wake-training = [
  "onnx>=1.16,<2",
]
